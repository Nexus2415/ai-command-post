# Shows, on every PR, whether a DIFFERENT AI approved the current commit, as recorded by GitHub (src/review-check.ts).
# Informational until the repository variable ACP_REQUIRE_INDEPENDENT_REVIEW is "true"; then a PR without an
# independent approval shows a red check. Read-only: it never comments, approves or merges.
name: Independent review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: independent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always run the check's code from the default branch, never the PR's: the job holds the apps' keys (only to
      # read each app's name), and a PR that edited src/ must not get to run with them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for an independent AI review
        run: node src/review-check.ts "$REPO#$PR"
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACP_REQUIRE_INDEPENDENT_REVIEW: ${{ vars.ACP_REQUIRE_INDEPENDENT_REVIEW }}
          ACP_GH_APP_CLAUDE_SLUG: ${{ vars.ACP_GH_APP_CLAUDE_SLUG }}
          ACP_GH_APP_CLAUDE_ID: ${{ vars.ACP_GH_APP_CLAUDE_ID || vars.ARNEXYIA_CLAUDE_BOT }}
          ACP_GH_APP_CLAUDE_KEY: ${{ secrets.ACP_GH_APP_CLAUDE_KEY || secrets.ARNEXYIA_CLAUDE_BOT }}
          ACP_GH_APP_CHATGPT_SLUG: ${{ vars.ACP_GH_APP_CHATGPT_SLUG }}
          ACP_GH_APP_CHATGPT_ID: ${{ vars.ACP_GH_APP_CHATGPT_ID || vars.ARNEXYIA_CHATGPT_BOT }}
          ACP_GH_APP_CHATGPT_KEY: ${{ secrets.ACP_GH_APP_CHATGPT_KEY || secrets.ARNEXYIA_CHATGPT_BOT }}
          ACP_GH_APP_PERPLEXITY_SLUG: ${{ vars.ACP_GH_APP_PERPLEXITY_SLUG }}
          ACP_GH_APP_PERPLEXITY_ID: ${{ vars.ACP_GH_APP_PERPLEXITY_ID || vars.ARNEXYIA_PERPLEXITY_BOT }}
          ACP_GH_APP_PERPLEXITY_KEY: ${{ secrets.ACP_GH_APP_PERPLEXITY_KEY || secrets.ARNEXYIA_PERPLEXITY_BOT }}
