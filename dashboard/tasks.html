<main class="ax-page">
  <div class="ax-title">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 12l2 2 4-4M8.5 17h7"/></svg>
    <div><h1>Tasks</h1><p>Track and manage your work.</p></div>
    <a class="ax-btn ghost" href="/workspace.html?mode=discuss">Ask AI team</a>
    <a class="ax-btn ax-act" href="/index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New task</a>
  </div>

  <div class="ax-stats" aria-label="Counts">
    <div class="ax-stat t-accent"><b id="cTotal">–</b><span>Total</span></div>
    <div class="ax-stat t-info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg><b id="cProg">–</b><span>In progress</span></div>
    <div class="ax-stat t-warn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b id="cReview">–</b><span>To review</span></div>
    <div class="ax-stat t-good"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><b id="cDone">–</b><span>Completed</span></div>
  </div>

  <div class="ax-seg" role="tablist" aria-label="Show">
    <button type="button" role="tab" id="tab-active" data-tab="active" aria-selected="true" aria-controls="tList">Active</button>
    <button type="button" role="tab" id="tab-review" data-tab="review" aria-selected="false" aria-controls="tList">Review</button>
    <button type="button" role="tab" id="tab-done" data-tab="done" aria-selected="false" aria-controls="tList">Completed</button>
  </div>
  <ul class="ax-list cards" id="tList" role="tabpanel" aria-labelledby="tab-active"><li class="ax-empty">Loading…</li></ul>
  <p class="ax-msg" id="tMsg" hidden></p>
  <p class="ax-muted" id="tFresh" style="font-size:13px;text-align:center;margin-top:14px"></p>
  <p style="text-align:center;margin-top:6px"><a class="ax-btn ghost" href="/command.html">Team map: who is working on what</a></p>
